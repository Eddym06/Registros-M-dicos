<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registros Médicos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      font-size: 18px;
      color: #1a202c;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #718096;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background: #f7fafc;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-dot.online {
      background: #48bb78;
      box-shadow: 0 0 0 3px rgba(72, 187, 120, 0.2);
    }

    .status-dot.offline {
      background: #f56565;
      box-shadow: 0 0 0 3px rgba(245, 101, 101, 0.2);
    }

    .status-dot.checking {
      background: #ed8936;
      box-shadow: 0 0 0 3px rgba(237, 137, 54, 0.2);
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .status-text {
      font-weight: 500;
      color: #2d3748;
    }

    .status-text.online {
      color: #22543d;
    }

    .status-text.offline {
      color: #742a2a;
    }

    .button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
    }

    .button-icon {
      font-size: 18px;
    }

    .info {
      margin-top: 16px;
      padding: 12px;
      background: #fff5f5;
      border-left: 4px solid #f56565;
      border-radius: 4px;
      font-size: 12px;
      color: #742a2a;
      display: none;
    }

    .info.show {
      display: block;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      font-size: 11px;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">🏥</div>
      <h1>Registros Médicos</h1>
      <p class="subtitle">Sistema de gestión local</p>
    </div>

    <div class="status" id="status">
      <span class="status-dot checking" id="statusDot"></span>
      <span class="status-text" id="statusText">Verificando servidor...</span>
    </div>

    <button class="button" id="openButton" disabled>
      <span class="button-icon">📋</span>
      <span>Abrir Registro Médico</span>
    </button>

    <button class="button" id="startButton" style="display: none; margin-top: 12px; background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);">
      <span class="button-icon">🚀</span>
      <span>Iniciar Servidor</span>
    </button>

    <div class="info" id="info">
      ⚠️ Servidor no disponible. Intente iniciarlo con el botón de arriba o manualmente:
      <br><br>
      <code style="background: #fff; padding: 4px 8px; border-radius: 4px; display: block; margin-top: 8px; font-size: 11px;">
        python -m uvicorn server.main:app --host 127.0.0.1 --port 5847
      </code>
    </div>

    <div class="footer">
      v1.0.0 • Sistema local seguro
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
